<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>ネイティブ検索入力の比較</title></head><body><h1>ネイティブ検索入力の比較</h1><p>親200件×子50件。各ボタンで独立した検証用保存領域を作成します。</p><button id="before" type="button">変更前を準備</button><button id="after" type="button">最終候補を準備</button><p id="status">待機</p><iframe id="app" title="検証用アプリ" style="width:1280px;height:900px"></iframe><script>
const status=document.getElementById('status');
for(const version of ['before','after'])document.getElementById(version).addEventListener('click',()=>{
 const old=document.getElementById('app'),frame=document.createElement('iframe');frame.id='app';frame.title='検証用アプリ';frame.style.cssText=old.style.cssText;old.replaceWith(frame);
 status.textContent=version;frame.src='/native?version='+version+'#/tasks';
});
</script></body></html>
